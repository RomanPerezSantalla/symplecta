name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # the matrix is what actually backs requires-python = ">=3.10"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build:
    # a release that does not build is worse than one that does not lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m build
          python -m twine check --strict dist/*

      # twine check only validates metadata. This runs the suite against the
      # installed wheel, so a module missing from the package is caught here
      # rather than by whoever pip installs it. The src layout is what makes
      # this work: `import symplecta` cannot reach src/, only site-packages.
      - name: Test the wheel rather than the source tree
        run: |
          python -m pip install dist/*.whl
          python -m pytest tests -q
