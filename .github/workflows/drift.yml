name: Drift check

# Does the *published* package still work against today's numpy and scipy?
#
# This is not looking for our bugs, the CI workflow does that. A release is
# frozen the moment it is uploaded, but its dependencies are not, and we
# declare numpy>=1.24 and scipy>=1.10 with no upper bound. When this goes red
# it means the ecosystem moved underneath a version that is already out in the
# world, and the fix is a new release with a cap or a patch.
on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  installed-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest supported, where drift shows up first
        python-version: ["3.10", "3.13"]

    steps:
      # the tests live in the repo, the package comes from PyPI
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # deliberately NOT `pip install -e .` — that would test this branch
      # instead of the release. The src layout keeps src/ off sys.path.
      - name: Install the published release and current dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --upgrade symplecta

      - name: Report what actually got resolved
        run: |
          python -c "import symplecta; print('symplecta', symplecta.__version__, 'from', symplecta.__file__)"
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"

      - name: Run the suite against it
        run: python -m pytest tests -q
