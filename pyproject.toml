[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symplecta"
dynamic = ["version"]
description = "Symplectic and geometric integrators for Hamiltonian systems, complementing scipy.integrate.solve_ivp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roman" }]
keywords = ["symplectic", "integrator", "hamiltonian", "verlet", "leapfrog", "ode", "RATTLE", "SHAKE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/RomanPerezSantalla/symplecta"
Issues = "https://github.com/RomanPerezSantalla/symplecta/issues"

[tool.hatch.version]
path = "src/symplecta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/symplecta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
